[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zarrshadow"
version = "0.1.0"
description = "Zarr stores that reference the bytes of existing files without copying them"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "zarr>=3.1.3",
    "h5py",
    "numpy",
    "numcodecs>=0.14.0",
    "fsspec",
    "tqdm",
    "requests",
]

[project.urls]
Repository = "https://github.com/bendichter/zarrshadow"

[project.optional-dependencies]
tiff = [
    "tifffile>=2026.4.11",
    "imagecodecs",
]
neo = [
    "neo>=0.14",
]
nwb = [
    "pynwb",
    "hdmf-zarr>=0.14.0",
]
virtualizarr = [
    "virtualizarr>=2.7",
]
dev = [
    "neo>=0.14",
    "pytest",
    "pynwb",
    "hdmf-zarr>=0.14.0",
    "tifffile>=2026.4.11",
    "imagecodecs",
    "virtualizarr[hdf]>=2.7",
]

[tool.pytest.ini_options]
markers = [
    "gin: tests that download NEO's testing data from GIN (run with -m gin)",
]
addopts = "-m 'not gin'"
