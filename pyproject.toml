[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zindi"
version = "0.1.0"
description = "Represent remote HDF5 NWB files as Zarr v3 via reference file systems"
requires-python = ">=3.12"
dependencies = [
    "zarr>=3.1.3",
    "h5py",
    "numpy",
    "numcodecs>=0.14.0",
    "fsspec",
    "tqdm",
    "requests",
]

[project.optional-dependencies]
tiff = [
    "tifffile>=2026.4.11",
    "imagecodecs",
]
neo = [
    "neo>=0.14",
]
nwb = [
    "pynwb",
    "hdmf-zarr>=0.14.0",
]
dev = [
    "neo>=0.14",
    "pytest",
    "pynwb",
    "hdmf-zarr>=0.14.0",
    "tifffile>=2026.4.11",
    "imagecodecs",
]

[tool.pytest.ini_options]
markers = [
    "gin: tests that download NEO's testing data from GIN (run with -m gin)",
]
addopts = "-m 'not gin'"
