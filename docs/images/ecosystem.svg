<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 548" width="960" height="548" role="img" aria-label="How the packages fit together. zarrshadow reads the headers of source files and writes kerchunk references; zarr-python reads them through zarrshadow's store, fetching byte ranges from the source files; materialize turns them into an ordinary Zarr store. In MATLAB, matzarr indexes MAT files for zarr-matlab."><title>How the packages fit together. zarrshadow reads the headers of source files and writes kerchunk references; zarr-python reads them through zarrshadow's store, fetching byte ranges from the source files; materialize turns them into an ordinary Zarr store. In MATLAB, matzarr indexes MAT files for zarr-matlab.</title>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;font-size:13px}.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:12px;white-space:pre}.sm11{font-size:11px}.b{font-weight:600}.none{fill:none}.bg{fill:#ffffff}text{fill:#1f2328}.fg{fill:#1f2328}.sfg{stroke:#1f2328}.m{fill:#59636e}.sm{stroke:#59636e}.sb{stroke:#d1d9e0}.panel{fill:#f6f8fa}.file{fill:#e6eaef}.meta{fill:#818b98}.ref{fill:#0969da}.sref{stroke:#0969da}.refbg{fill:#ddf4ff}.hi{fill:#bc4c00}.shi{stroke:#bc4c00}.hibg{fill:#fff1e5}@media (prefers-color-scheme:dark){.bg{fill:#0d1117}text{fill:#f0f6fc}.fg{fill:#f0f6fc}.sfg{stroke:#f0f6fc}.m{fill:#9198a1}.sm{stroke:#9198a1}.sb{stroke:#3d444d}.panel{fill:#151b23}.file{fill:#262c36}.meta{fill:#656c76}.ref{fill:#4493f8}.sref{stroke:#4493f8}.refbg{fill:#0c2d6b}.hi{fill:#f0883e}.shi{stroke:#f0883e}.hibg{fill:#3d1f00}}</style>
<defs><marker id="ah-fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fg"/></marker><marker id="ah-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m"/></marker><marker id="ah-ref" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ref"/></marker><marker id="ah-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="hi"/></marker></defs><rect x="0" y="0" width="960" height="548" rx="6" class="bg"/><text x="20" y="24" class="b">Source files</text><text x="215" y="24" class="b">Describe where the bytes are</text><text x="490" y="24" class="b">References</text><text x="735" y="24" class="b">Read as Zarr</text><rect x="20" y="62" width="150" height="238" rx="6" class="panel sb" stroke-width="1"/><text x="32" y="86" class="b">Raw ephys</text><text x="32" y="102" class="m sm11">SpikeGLX, Open Ephys, …</text><text x="32" y="136" class="b">TIFF stacks</text><text x="32" y="152" class="m sm11">ScanImage, Bruker, …</text><text x="32" y="186" class="b">HDF5 and NWB</text><text x="32" y="202" class="m sm11">local or remote</text><text x="32" y="262" class="m sm11">The data stays here.</text><text x="32" y="278" class="m sm11">Nothing is copied.</text><rect x="215" y="62" width="230" height="50" rx="6" class="panel sb" stroke-width="1"/><text x="227" y="83" class="b">NeuroConv</text><text x="227" y="100" class="m sm11">with SpikeInterface and NEO</text><path d="M330,112 L330,138" class="none sm" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-m)"/><text x="338" y="129" class="m sm11">NWBFile (experimental)</text><rect x="215" y="138" width="230" height="108" rx="6" class="refbg sref" stroke-width="1"/><text x="227" y="160" class="b">zarrshadow</text><text x="227" y="180" class="sm11">generators: HDF5, TIFF, NEO readers</text><text x="227" y="196" class="sm11">VirtualArray: slice, stack, transpose</text><text x="227" y="212" class="sm11">write_virtual_nwb</text><text x="227" y="234" class="m sm11">reads headers with h5py, tifffile, NEO</text><path d="M170,192 L215,192" class="none sm" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-m)"/><rect x="215" y="272" width="230" height="28" rx="6" class="panel sb" stroke-width="1"/><text x="227" y="291" class="b">hdmf-zarr and PyNWB</text><path d="M330,272 L330,246" class="none sm" stroke-width="1.5" marker-end="url(#ah-m)"/><text x="338" y="263" class="m sm11">write the NWB structure</text><rect x="490" y="138" width="200" height="162" rx="6" class="hibg shi" stroke-width="1"/><text x="502" y="160" class="b">kerchunk references</text><text x="502" y="182" class="mono sm11">zarr.json, small arrays</text><text x="502" y="198" class="mono sm11">c/0/0: [url, offset, size]</text><text x="502" y="224" class="m sm11">version 2 adds</text><text x="502" y="240" class="mono sm11">gen, indexes,</text><text x="502" y="256" class="mono sm11">selections, sources</text><text x="502" y="284" class="m sm11">JSON with Zarr v3 keys</text><path d="M445,192 L490,192" class="none shi" stroke-width="1.5" marker-end="url(#ah-hi)"/><text x="467" y="186" class="m sm11" text-anchor="middle">writes</text><rect x="735" y="62" width="205" height="34" rx="6" class="refbg sref" stroke-width="1"/><text x="747" y="84" class="b">zarrshadow RfsStore</text><rect x="735" y="112" width="205" height="34" rx="6" class="panel sb" stroke-width="1"/><text x="747" y="134" class="b">zarr-python</text><rect x="735" y="162" width="205" height="50" rx="6" class="panel sb" stroke-width="1"/><text x="747" y="183" class="b">hdmf-zarr NWBZarrIO</text><text x="747" y="200" class="m sm11">PyNWB objects, validation</text><path d="M838,96 L838,112" class="none sm" stroke-width="1.5" marker-end="url(#ah-m)"/><path d="M838,146 L838,162" class="none sm" stroke-width="1.5" marker-end="url(#ah-m)"/><rect x="735" y="250" width="205" height="50" rx="6" class="panel sb" stroke-width="1"/><text x="747" y="271" class="b">fsspec</text><text x="747" y="288" class="m sm11">version 1 files only</text><path d="M690,170 C714,170 712,79 735,79" class="none shi" stroke-width="1.5" marker-end="url(#ah-hi)"/><path d="M690,266 C712,266 714,275 735,275" class="none shi" stroke-width="1.5" marker-end="url(#ah-hi)"/><path d="M838,62 L838,46 L95,46 L95,62" class="none sref" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-ref)"/><text x="466" y="40" class="ref sm11" text-anchor="middle">byte-range requests for the chunks that are read</text><rect x="490" y="330" width="200" height="62" rx="6" class="refbg sref" stroke-width="1"/><text x="502" y="352" class="b">zarrshadow.materialize</text><text x="502" y="368" class="m sm11">reads the bytes, rechunks,</text><text x="502" y="382" class="m sm11">compresses</text><path d="M590,300 L590,330" class="none shi" stroke-width="1.5" marker-end="url(#ah-hi)"/><rect x="735" y="330" width="205" height="62" rx="6" class="panel sb" stroke-width="1"/><text x="747" y="352" class="b">Zarr v3 store, no references</text><text x="747" y="368" class="m sm11">zarr-python, zarr-matlab,</text><text x="747" y="382" class="m sm11">zarrita.js; upload to DANDI</text><path d="M690,361 L735,361" class="none sm" stroke-width="1.5" marker-end="url(#ah-m)"/><line x1="20" y1="414" x2="940" y2="414" class="sb" stroke-width="1"/><text x="20" y="430" class="m sm11 b">MATLAB</text><rect x="20" y="440" width="150" height="56" rx="6" class="panel sb" stroke-width="1"/><text x="32" y="462" class="b">MAT files</text><text x="32" y="479" class="m sm11">v7.3, which are HDF5</text><rect x="215" y="440" width="230" height="56" rx="6" class="panel sb" stroke-width="1"/><text x="227" y="462" class="b">matzarr.index</text><text x="227" y="479" class="m sm11">scans the file once</text><rect x="490" y="440" width="200" height="56" rx="6" class="hibg shi" stroke-width="1"/><text x="502" y="462" class="b">index directory</text><text x="502" y="479" class="m sm11">Zarr v3 metadata, manifest.json</text><rect x="735" y="440" width="205" height="56" rx="6" class="panel sb" stroke-width="1"/><text x="747" y="462" class="b">zarr-matlab ManifestStore</text><text x="747" y="479" class="m sm11">matzarr.open gives MATLAB types</text><path d="M170,468 L215,468" class="none sm" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-m)"/><path d="M445,468 L490,468" class="none shi" stroke-width="1.5" marker-end="url(#ah-hi)"/><path d="M690,468 L735,468" class="none shi" stroke-width="1.5" marker-end="url(#ah-hi)"/><path d="M838,496 L838,516 L95,516 L95,496" class="none sref" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-ref)"/><text x="466" y="532" class="ref sm11" text-anchor="middle">byte-range requests</text><path d="M500,440 L500,404 L468,404 L468,284 L490,284" class="none sm" stroke-width="1.5" marker-end="url(#ah-m)"/><text x="462" y="348" class="mono sm11" text-anchor="end">shim_kerchunk.py</text></svg>
