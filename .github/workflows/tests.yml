name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays and Thursdays, to catch changes in NEO and its testing data and
    # to keep the data cache, which GitHub deletes after 7 days without use.
    - cron: "0 6 * * 1,4"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -v

  gin:
    name: NEO generator on GIN data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install zarrshadow, datalad, and git-annex
        run: |
          pip install -e ".[dev]" datalad git-annex
          git config --global user.name "CI"
          git config --global user.email "ci@example.org"
      # GIN sometimes refuses connections from GitHub's runners. When it does,
      # the hash is empty and the tests run on the most recent cached copy.
      - name: Get the current commit of NEO's testing data
        id: ephy
        run: echo "hash=$(git ls-remote https://gin.g-node.org/NeuralEnsemble/ephy_testing_data.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"
      - name: Restore the cached testing data
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: ~/ephy_testing_data
          key: ephy-testing-data-${{ steps.ephy.outputs.hash }}-${{ hashFiles('tests/test_neo_gin.py') }}
          restore-keys: ephy-testing-data-
      - run: pytest -m gin -v
        env:
          # Update the copy only when GIN answered and has a newer commit.
          EPHY_TESTING_DATA_UPDATE: ${{ steps.ephy.outputs.hash != '' && steps.cache.outputs.cache-hit != 'true' && '1' || '0' }}
      - name: Cache the testing data
        if: steps.ephy.outputs.hash != '' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/ephy_testing_data
          key: ephy-testing-data-${{ steps.ephy.outputs.hash }}-${{ hashFiles('tests/test_neo_gin.py') }}

  neuroconv:
    name: NeuroConv bridge on GIN data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # SpikeInterface requires zarr<3 and zarrshadow needs Zarr v3, so the two
      # install together only with that requirement overridden. Remove the
      # override once SpikeInterface supports Zarr v3
      # (https://github.com/SpikeInterface/spikeinterface/pull/4260).
      - name: Install zarrshadow and NeuroConv with Zarr v3
        run: |
          pip install uv
          printf 'zarr>=3.1.3\nnumcodecs>=0.15\n' > overrides.txt
          uv pip install --system --override overrides.txt -e ".[dev]" \
            "neuroconv[spikeglx,openephys,neuroscope,mcsraw]" datalad git-annex
          git config --global user.name "CI"
          git config --global user.email "ci@example.org"
      - name: Get the current commit of NEO's testing data
        id: ephy
        run: echo "hash=$(git ls-remote https://gin.g-node.org/NeuralEnsemble/ephy_testing_data.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"
      - name: Restore the cached testing data
        uses: actions/cache/restore@v5
        with:
          path: ~/ephy_testing_data
          key: ephy-testing-data-${{ steps.ephy.outputs.hash }}-${{ hashFiles('tests/test_neo_gin.py') }}
          restore-keys: ephy-testing-data-
      - run: pytest -m gin -v tests/test_neuroconv_bridge.py
