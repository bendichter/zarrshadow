name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays and Thursdays, to catch changes in NEO and its testing data and
    # to keep the data cache, which GitHub deletes after 7 days without use.
    - cron: "0 6 * * 1,4"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -v

  # GIN refuses about half of GitHub's runners (HTTP 403), for as long as the
  # runner lives. So the data is downloaded ahead of the tests, on several
  # runners at once, and whichever of them GIN answers saves it to the cache.
  # The test jobs read the cache and contact GIN only for what it lacks.
  data:
    name: GIN data (runner ${{ matrix.runner }})
    runs-on: ubuntu-latest
    timeout-minutes: 15  # GIN can leave a connection hanging
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        runner: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - name: Get the current commits of the testing data
        id: gin
        run: |
          ephys=$(timeout 60 git ls-remote https://gin.g-node.org/NeuralEnsemble/ephy_testing_data.git HEAD | cut -f1 || true)
          ophys=$(timeout 60 git ls-remote https://gin.g-node.org/CatalystNeuro/ophys_testing_data.git HEAD | cut -f1 || true)
          if [ -n "$ephys" ] && [ -n "$ophys" ]; then
            echo "commits=$ephys-$ophys" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GIN refused this runner"
          fi
      - name: Restore the cached testing data
        id: cache
        if: steps.gin.outputs.commits != ''
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/ephy_testing_data
            ~/ophys_testing_data
          key: gin-data-${{ hashFiles('tests/gin_data.py', 'tests/test_neo_gin.py', 'tests/test_neuroconv_bridge.py') }}-${{ steps.gin.outputs.commits }}
          restore-keys: |
            gin-data-${{ hashFiles('tests/gin_data.py', 'tests/test_neo_gin.py', 'tests/test_neuroconv_bridge.py') }}-
            gin-data-
      - uses: actions/setup-python@v6
        if: steps.gin.outputs.commits != '' && steps.cache.outputs.cache-hit != 'true'
        with:
          python-version: "3.12"
      - name: Download what the tests read
        if: steps.gin.outputs.commits != '' && steps.cache.outputs.cache-hit != 'true'
        run: |
          pip install -e ".[dev]" datalad git-annex
          git config --global user.name "CI"
          git config --global user.email "ci@example.org"
          python tests/gin_data.py
        env:
          EPHY_TESTING_DATA_UPDATE: "1"
          OPHYS_TESTING_DATA_UPDATE: "1"
      - name: Cache the testing data
        if: steps.gin.outputs.commits != '' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/ephy_testing_data
            ~/ophys_testing_data
          key: gin-data-${{ hashFiles('tests/gin_data.py', 'tests/test_neo_gin.py', 'tests/test_neuroconv_bridge.py') }}-${{ steps.gin.outputs.commits }}

  gin:
    name: NEO generator on GIN data
    needs: data
    runs-on: ubuntu-latest
    timeout-minutes: 25  # GIN can leave a connection hanging
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install zarrshadow, datalad, and git-annex
        run: |
          pip install -e ".[dev]" datalad git-annex
          git config --global user.name "CI"
          git config --global user.email "ci@example.org"
      - name: Restore the cached testing data
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/ephy_testing_data
            ~/ophys_testing_data
          key: gin-data-${{ hashFiles('tests/gin_data.py', 'tests/test_neo_gin.py', 'tests/test_neuroconv_bridge.py') }}-
          restore-keys: |
            gin-data-${{ hashFiles('tests/gin_data.py', 'tests/test_neo_gin.py', 'tests/test_neuroconv_bridge.py') }}-
            gin-data-
      - run: pytest -m gin -v

  neuroconv:
    name: NeuroConv bridge on GIN data
    needs: data
    runs-on: ubuntu-latest
    timeout-minutes: 25  # GIN can leave a connection hanging
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # SpikeInterface requires zarr<3 and zarrshadow needs Zarr v3, so the two
      # install together only with that requirement overridden. Remove the
      # override once SpikeInterface supports Zarr v3
      # (https://github.com/SpikeInterface/spikeinterface/pull/4260).
      - name: Install zarrshadow and NeuroConv with Zarr v3
        run: |
          pip install uv
          printf 'zarr>=3.1.3\nnumcodecs>=0.15\n' > overrides.txt
          uv pip install --system --override overrides.txt -e ".[dev]" \
            "neuroconv[spikeglx,openephys,neuroscope,mcsraw,blackrock,spikegadgets,tiff,scanimage,brukertiff,thor,micromanagertiff,hdf5]" \
            datalad git-annex
          git config --global user.name "CI"
          git config --global user.email "ci@example.org"
      - name: Restore the cached testing data
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/ephy_testing_data
            ~/ophys_testing_data
          key: gin-data-${{ hashFiles('tests/gin_data.py', 'tests/test_neo_gin.py', 'tests/test_neuroconv_bridge.py') }}-
          restore-keys: |
            gin-data-${{ hashFiles('tests/gin_data.py', 'tests/test_neo_gin.py', 'tests/test_neuroconv_bridge.py') }}-
            gin-data-
      - run: pytest -m gin -v tests/test_neuroconv_bridge.py
